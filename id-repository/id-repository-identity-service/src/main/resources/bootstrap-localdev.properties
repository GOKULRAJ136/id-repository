# Bootstrap overrides for local development (LOCAL_DEV_SETUP.md in this module).
# Loaded only when the "localdev" profile is active. Not named "local": the
# kernel auth adapter rejects tokens outright under a profile named "local".

spring.cloud.config.uri=http://localhost:51000/config
spring.cloud.config.label=master
# mosip-config's *-default files first, then the local overlay
# (local-dev-setup/config/id-repository-localdev.properties) on top.
spring.cloud.config.profile=default,localdev
spring.cloud.config.fail-fast=true

# kernel-auth-adapter pulls in Spring Cloud LoadBalancer, which would otherwise
# treat "localhost" as a service-registry name and fail outbound calls.
spring.cloud.loadbalancer.enabled=false
