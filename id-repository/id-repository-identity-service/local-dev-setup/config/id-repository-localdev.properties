# -----------------------------------------------------------------------------
# Identity Service - local development overrides
#
# Served by the local config server as profile "localdev". The service requests
# profiles "default,localdev" (see src/main/resources/bootstrap-localdev.properties),
# so everything here overrides application-default.properties and
# id-repository-default.properties from your unmodified mosip-config clone.
#
# DEV ONLY: every secret below is a throwaway value for the local Docker stack.
# -----------------------------------------------------------------------------

# --- Hosts --------------------------------------------------------------------
mosip.api.internal.host=localhost
mosip.api.public.host=localhost

# Swagger UI "Try it out" target. mosip-config builds it as https://<host> with no
# port, which points the browser at a port nothing listens on.
openapi.idRepoIdentityServiceServer.servers[0].url=http://localhost:8090/idrepository/v1/identity

# --- Keycloak (auth adapter) -> WireMock --------------------------------------
# Self-token: POST {keycloak}/auth/realms/mosip/protocol/openid-connect/token
# Incoming tokens: validated online via .../protocol/openid-connect/userinfo,
# then roles/audience are read from the JWT itself (see samples/dev-token.txt).
keycloak.internal.url=http://localhost:8082
keycloak.external.url=http://localhost:8082
auth.server.admin.offline.comp.token.validate=false

# --- Platform services -> WireMock (docker-compose/wiremock/mappings) ----------
mosip.kernel.authmanager.url=http://localhost:8082
mosip.kernel.masterdata.url=http://localhost:8082
mosip.kernel.syncdata.url=http://localhost:8082
mosip.kernel.keymanager.url=http://localhost:8082
mosip.kernel.auditmanager.url=http://localhost:8082
mosip.kernel.idgenerator.url=http://localhost:8082
mosip.kernel.notification.url=http://localhost:8082
mosip.idrepo.vid.url=http://localhost:8082
mosip.idrepo.credrequest.generator.url=http://localhost:8082
mosip.idrepo.credential.service.url=http://localhost:8082
mosip.pms.partnermanager.url=http://localhost:8082
mosip.pms.policymanager.url=http://localhost:8082
mosip.datashare.url=http://localhost:8082
mosip.websub.url=http://localhost:8082

# The identity service itself (used to build its WebSub callback URL)
mosip.idrepo.identity.url=http://localhost:8090

# --- Biometric SDK -> biosdk-service container ---------------------------------
mosip.mock.biosdk.url=http://localhost:8083
mosip.idrepo.biosdk.url=http://localhost:8083

# Accept any "requesttime" (default is +/-60s) so the files in ../samples can be
# sent as-is without regenerating timestamps.
mosip.idrepo.identity.max-request-time-deviation-seconds=315360000

# The reference validator jar (kernel-ref-idobjectvalidator) is only added to the
# container image at runtime; locally the built-in no-op validator is used.
mosip.kernel.idobjectvalidator.referenceValidator=

# --- Database -> postgres container --------------------------------------------
mosip.idrepo.db.url=localhost
mosip.idrepo.db.port=5455
db.dbuser.password=mosip123

# --- Object store -> S3Mock container (any credentials are accepted) -------------
object.store.s3.url=http://localhost:9090
s3.accesskey=localdev
s3.secretkey=localdev
s3.region=us-east-1

# --- Secrets normally injected from Kubernetes secrets (dummy values) -----------
mosip.idrepo.client.secret=localdev
mosip.creser.client.secret=localdev
mosip.idrepo.credential-req-generator.auth.app-id=crereq
mosip.idrepo.credential-req-generator.auth.client-id=mosip-crereq-client
mosip.idrepo.credential-req-generator.auth.secret-key=localdev
mosip.idrepo.credential.auth.app-id=creser
mosip.idrepo.credential.auth.client-id=mosip-creser-client
idrepo.websub.vid.credential.update.secret=localdev
mosip.kernel.uin.salt=zHuDEAbmbxiUbUShgy6pwUhKh9DE0EZn9kQDKPPKbWscGajMwf
mosip.kernel.partnercode.salt=yS8w5Wb6vhIKdf1msi4LYTJks7mqkbmITk2O63Iq8h0bkRlD0d
